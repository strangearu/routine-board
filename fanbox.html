<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>FANBOX作成 | ルーティンボード</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e3e5e9; --chip:#f1f2f4;
    --tx:#1e1f21; --tx2:#5f6368; --tx3:#9ca0a4;
    --pink:#f06a6a; --accent:#e85d9a; --green:#2eaf7d; --blue:#4573d2; --red:#e05252;
    --shadow:0 1px 3px rgba(15,20,32,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
    font-size:15px; line-height:1.6; padding-bottom:60px}
  .wrap{max-width:680px; margin:0 auto; padding:12px 14px}
  header{display:flex; align-items:center; gap:10px; padding:4px 0 12px}
  header a{color:var(--tx2); text-decoration:none; font-size:14px; background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:6px 11px}
  h1{font-size:17px; margin:0; flex:1}
  .modes{display:flex; gap:6px; margin-bottom:14px}
  .modes button{flex:1; font-size:14px; font-weight:700; padding:10px 0; border-radius:12px; cursor:pointer;
    background:var(--card); color:var(--tx2); border:1px solid var(--line)}
  .modes button.on{background:var(--accent); color:#fff; border-color:transparent}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow)}
  label{display:block; font-size:12.5px; font-weight:700; color:var(--tx2); margin:10px 0 4px}
  label:first-child{margin-top:0}
  input[type=text], input[type=number], textarea, select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg); color:var(--tx); font-size:15px; font-family:inherit}
  textarea{min-height:64px; resize:vertical}
  .row{display:flex; gap:10px}
  .row>div{flex:1}
  .seg{display:flex; gap:6px; flex-wrap:wrap}
  .seg button{font-size:13px; padding:7px 12px; border-radius:99px; cursor:pointer;
    background:var(--bg); color:var(--tx2); border:1px solid var(--line)}
  .seg button.on{background:var(--tx); color:var(--bg); border-color:transparent; font-weight:700}
  #photo-zone{display:none}
  .thumbs{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .thumbs img{width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line)}
  .thumbs .del{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:99px;
    background:var(--red); color:#fff; border:none; font-size:11px; cursor:pointer; line-height:1}
  .thumb{position:relative}
  #gen{width:100%; padding:14px; border:none; border-radius:14px; font-size:16px; font-weight:800; cursor:pointer;
    background:linear-gradient(90deg,var(--accent),#f0868d); color:#fff; margin-top:4px}
  #gen:disabled{opacity:.55}
  #status{font-size:13px; color:var(--tx2); text-align:center; min-height:20px; margin-top:8px}
  .out{display:none}
  .out h3{font-size:12.5px; color:var(--tx3); margin:0 0 6px; display:flex; align-items:center}
  .out h3 button{margin-left:auto; font-size:12px; padding:4px 12px; border-radius:99px; cursor:pointer;
    background:var(--chip); border:1px solid var(--line); color:var(--tx2)}
  .out .val{font-size:15px; white-space:pre-wrap; word-break:break-word}
  #o-body{width:100%; min-height:150px}
  .actions{display:flex; gap:8px; margin-top:4px}
  .actions button{flex:1; padding:11px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--tx)}
  .actions button.primary{background:var(--tx); color:var(--bg); border-color:transparent}
  #cost{font-size:12px; color:var(--tx3); text-align:right; margin-top:6px}
  .note{font-size:12px; color:var(--tx3); line-height:1.7}
  #keybox{display:none}
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#2b2c2e; color:#fff;
    padding:10px 22px; border-radius:99px; font-size:14px; opacity:0; transition:.3s; pointer-events:none; z-index:20}
  #toast.show{opacity:1}
  #gate{position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:9}
  #gate .box{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px; width:min(330px,86vw); text-align:center; box-shadow:var(--shadow)}
  #gate input{margin:16px 0 10px; text-align:center; letter-spacing:.2em; font-size:17px}
  #gate button{width:100%; padding:12px; border:none; border-radius:12px; font-size:15.5px; cursor:pointer; background:var(--accent); color:#fff; font-weight:700}
  #gerr{color:var(--red); font-size:13px; min-height:18px; margin-top:8px}
  #loading{text-align:center; color:var(--tx3); padding:70px 0}
</style>
</head>
<body>
<div class="wrap">
  <header><a href="index.html">← ボード</a><h1>🎀 FANBOX作成</h1></header>
  <div id="loading">読み込み中…</div>
  <div id="app" style="display:none">
    <div class="modes">
      <button id="m-ai" onclick="setMode('ai')">✨ AI生成</button>
      <button id="m-tpl" onclick="setMode('tpl')">📋 テンプレ（0円）</button>
    </div>

    <div class="card">
      <label>シリーズ名・衣装名 *</label>
      <input type="text" id="in-costume" placeholder="例: 小悪魔">
      <div class="row">
        <div>
          <label>投稿の種類</label>
          <select id="in-type">
            <option value="main">メイン投稿（シリーズ初回）</option>
            <option value="month">メイン投稿（月初あいさつ）</option>
            <option value="tsuzuki">続き物（②③…・短文）</option>
            <option value="teaser">ティザー（全体公開の予告）</option>
          </select>
        </div>
        <div>
          <label>番号（続き物なら）</label>
          <input type="text" id="in-num" placeholder="② など">
        </div>
      </div>
      <div class="row">
        <div>
          <label>枚数（載せるなら）</label>
          <input type="number" id="in-n" placeholder="50">
        </div>
        <div>
          <label>トーン</label>
          <div class="seg" id="tone-seg">
            <button data-v="auto" class="on">おまかせ</button>
            <button data-v="oshi">押し</button>
            <button data-v="yuru">ゆる</button>
          </div>
        </div>
      </div>
      <label>触れたい話題・近況（任意）</label>
      <textarea id="in-topic" placeholder="例: フランスから帰ってきた／8/16のコミケ告知も入れたい"></textarea>
      <div id="photo-zone">
        <label>写真（任意・最大3枚。内容に忠実な文章になります）</label>
        <input type="file" id="in-photos" accept="image/*" multiple>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>

    <div class="card" id="keybox">
      <label>Anthropic APIキー（未設定です）</label>
      <input type="text" id="in-key" placeholder="sk-ant-…">
      <p class="note">クロス投稿ツールと共通のキーです。この端末のブラウザ内にだけ保存されます。</p>
      <div class="actions"><button class="primary" onclick="saveKey()">保存</button></div>
    </div>

    <button id="gen" onclick="generate()">文面を作る</button>
    <div id="status"></div>

    <div class="card out" id="out">
      <h3>タイトル <button onclick="copyText(el('o-title').textContent, 'タイトル')">コピー</button></h3>
      <div class="val" id="o-title"></div>
      <h3 style="margin-top:14px">本文（直接編集OK） <button onclick="copyText(el('o-body').value, '本文')">コピー</button></h3>
      <textarea id="o-body"></textarea>
      <h3 style="margin-top:14px">タグ <button onclick="copyText(el('o-tags').textContent, 'タグ')">コピー</button></h3>
      <div class="val" id="o-tags"></div>
      <div class="actions" style="margin-top:14px">
        <button onclick="generate()">🔄 もう一回</button>
        <button class="primary" onclick="copyAll()">ぜんぶコピー</button>
      </div>
      <div id="cost"></div>
    </div>

    <p class="note">💡 コピーしたら fanbox.cc で新規投稿に貼り付け（公開はご本人）。下書き保存まで全自動にしたい時は、ボードの「💬 FANBOXをClaudeで」からどうぞ。</p>
  </div>
</div>
<div id="toast"></div>
<div id="gate"><div class="box">
  <div style="font-size:34px">🔒</div>
  <div style="font-size:15px; color:var(--tx2); margin-top:6px">ハブと同じパスコードを入力</div>
  <input id="gpass" type="password" inputmode="numeric" autocomplete="off">
  <button onclick="submitPass()">ひらく</button>
  <div id="gerr"></div>
</div></div>
<script>
const el = id => document.getElementById(id);
const API_KEY_LS = "anthropic-api-key", API_MODEL_LS = "anthropic-api-model";
const API_PRICES = { "claude-sonnet-5": { i: 3, o: 15 }, "claude-opus-5": { i: 5, o: 25 }, "claude-fable-5": { i: 10, o: 50 } };
const YEN = 150;
let ASSETS = null, MODE = "ai", TONE = "auto", photos = [], lastToneUsed = null;

function toast(m){const t=el("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2000);}
function copyText(s,label){navigator.clipboard.writeText(s).then(()=>toast(label+"をコピーしました"));}
function copyAll(){
  const s = el("o-title").textContent + "\n\n" + el("o-body").value + "\n\n" + el("o-tags").textContent;
  navigator.clipboard.writeText(s).then(()=>toast("ぜんぶコピーしました"));
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function setMode(m){
  MODE=m;
  el("m-ai").classList.toggle("on",m==="ai");
  el("m-tpl").classList.toggle("on",m==="tpl");
  el("photo-zone").style.display = m==="ai" ? "block" : "none";
  el("keybox").style.display = (m==="ai" && !(localStorage.getItem(API_KEY_LS)||"").trim()) ? "block" : "none";
  el("gen").textContent = m==="ai" ? "✨ 文面を作る（1回2〜4円）" : "📋 文面を組み立てる（0円）";
}
document.querySelectorAll("#tone-seg button").forEach(b=>{
  b.addEventListener("click",()=>{
    TONE=b.dataset.v;
    document.querySelectorAll("#tone-seg button").forEach(x=>x.classList.toggle("on",x===b));
  });
});
function saveKey(){
  const k = el("in-key").value.trim();
  if(!k) return;
  localStorage.setItem(API_KEY_LS,k);
  el("keybox").style.display="none";
  toast("キーを保存しました");
}

/* ---- 写真（1024pxに縮小してトークン節約） ---- */
el("in-photos") && el("in-photos").addEventListener("change", async e=>{
  for(const f of Array.from(e.target.files).slice(0, 3-photos.length)){
    const url = await resizeImage(f, 1024);
    photos.push(url);
  }
  renderThumbs();
  e.target.value="";
});
function resizeImage(file, MAX){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.naturalWidth, h=img.naturalHeight;
      if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s);}
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",0.85));
      URL.revokeObjectURL(img.src);
    };
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}
function renderThumbs(){
  const t=el("thumbs"); t.innerHTML="";
  photos.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="thumb";
    d.innerHTML='<img src="'+p+'"><button class="del">✕</button>';
    d.querySelector(".del").addEventListener("click",()=>{photos.splice(i,1);renderThumbs();});
    t.appendChild(d);
  });
}

/* ---- 生成 ---- */
function inputs(){
  return {
    costume: el("in-costume").value.trim(),
    type: el("in-type").value,
    num: el("in-num").value.trim(),
    n: el("in-n").value.trim(),
    topic: el("in-topic").value.trim(),
    tone: TONE,
  };
}
async function generate(){
  const q = inputs();
  if(!q.costume){toast("シリーズ名・衣装名を入れてください"); el("in-costume").focus(); return;}
  if(MODE==="tpl"){renderOut(tplGenerate(q), null); return;}
  const key=(localStorage.getItem(API_KEY_LS)||"").trim();
  if(!key){el("keybox").style.display="block"; toast("APIキーを設定してください"); return;}
  el("gen").disabled=true; el("status").textContent="生成中…";
  try{
    const res = await aiGenerate(q);
    renderOut(res.data, res.yen);
  }catch(e){
    el("status").textContent="⚠️ "+e.message;
  }finally{
    el("gen").disabled=false;
  }
}
function renderOut(data, yen){
  el("o-title").textContent = data.title||"";
  el("o-body").value = data.body||"";
  el("o-tags").textContent = (data.tags||[]).join(" ");
  el("out").style.display="block";
  el("cost").textContent = yen!=null ? ("この生成: 約"+yen.toFixed(1)+"円") : "テンプレ生成（0円）";
  el("status").textContent="";
  el("out").scrollIntoView({behavior:"smooth"});
}

/* ---- AIモード（クロス投稿ツールと同じ実証済みAPI呼び出し） ---- */
function toneLabel(t){return t==="oshi"?"押し系（枚数・締切訴求・自画自賛強め）":t==="yuru"?"ゆる系（感謝ベース・売り込み薄め）":"おまかせ（押しとゆるを自然に混合）";}
function typeLabel(t){return {main:"メイン投稿（シリーズ初回・200〜400字のフル構成）",month:"メイン投稿（月初あいさつ・今月もよろしくの導入で始める）",tsuzuki:"続き物（②③…）。重要: 1〜3行だけの短文にする",teaser:"ティザー（全体公開の予告。有料プランへの導線・チラ見せ感）"}[t];}
function buildPrompt(q){
  const today = new Date();
  let p = ASSETS.ai.rules + "\n\n---\n【今回の依頼】\n";
  p += "- シリーズ名・衣装名: " + q.costume + (q.num?("（"+q.num+"）"):"") + "\n";
  p += "- 種類: " + typeLabel(q.type) + "\n";
  p += "- トーン: " + toneLabel(q.tone) + "\n";
  if(q.n) p += "- 掲載枚数: 約" + q.n + "枚（本文かタイトルで訴求してよい）\n";
  if(q.topic) p += "- 触れたい話題・近況: " + q.topic + "\n";
  p += "- 今日: " + (today.getMonth()+1) + "月" + today.getDate() + "日\n";
  if(photos.length) p += "- 添付写真: " + photos.length + "枚（写っている衣装・雰囲気に忠実に。写真にない要素を発明しない）\n";
  p += "- タグ: シリーズ名・キャラ名・「コスプレ」など3〜5個\n\n" + ASSETS.ai.output_format;
  return p;
}
async function aiGenerate(q){
  const key=(localStorage.getItem(API_KEY_LS)||"").trim();
  const model=localStorage.getItem(API_MODEL_LS)||"claude-sonnet-5";
  const imageBlocks = photos.map(p=>{
    const m=p.match(/^data:(image\/[a-z+]+);base64,(.+)$/s);
    return m?{type:"image",source:{type:"base64",media_type:m[1],data:m[2]}}:null;
  }).filter(Boolean);
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),180000);
  let r;
  try{
    r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", signal:ctrl.signal,
      headers:{
        "content-type":"application/json",
        "x-api-key":key,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true",
      },
      body:JSON.stringify({
        model, max_tokens:3000, stream:true,
        thinking:{type:"adaptive"},
        messages:[{role:"user",content:[...imageBlocks,{type:"text",text:buildPrompt(q)}]}],
      }),
    });
  }catch(e){
    clearTimeout(timer);
    if(e.name==="AbortError") throw new Error("3分でタイムアウトしました。電波の良い場所でもう一度どうぞ");
    throw new Error("接続できませんでした（電波を確認して再実行）");
  }
  if(!r.ok){
    clearTimeout(timer);
    const data=await r.json().catch(()=>({}));
    const msg=(data.error&&data.error.message)||("HTTP "+r.status);
    if(r.status===401) throw new Error("APIキーが無効です");
    if(r.status===429) throw new Error("レート制限中です。1分ほど待って再実行してください");
    if(r.status===400&&/credit/i.test(msg)) throw new Error("API残高が不足しています");
    throw new Error(msg);
  }
  const reader=r.body.getReader(); const dec=new TextDecoder();
  let buf="", text="", inTok=0, outTok=0;
  try{
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf("\n\n"))>=0){
        const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        for(const line of chunk.split("\n")){
          if(!line.startsWith("data:")) continue;
          let ev; try{ev=JSON.parse(line.slice(5));}catch(e){continue;}
          if(ev.type==="error") throw new Error((ev.error&&ev.error.message)||"APIエラー");
          if(ev.type==="message_start"&&ev.message&&ev.message.usage) inTok=ev.message.usage.input_tokens||0;
          if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.type==="text_delta"){
            text+=ev.delta.text;
            el("status").textContent="生成中… "+text.length+"文字";
          }
          if(ev.type==="message_delta"&&ev.usage) outTok=ev.usage.output_tokens||outTok;
        }
      }
    }
  }finally{clearTimeout(timer);}
  if(!text.trim()) throw new Error("応答が空でした。もう一度お試しください");
  const p=API_PRICES[model]||API_PRICES["claude-sonnet-5"];
  const yen=(inTok*p.i+outTok*p.o)/1e6*YEN;
  let data;
  try{
    const m=text.match(/\{[\s\S]*\}/);
    data=JSON.parse(m?m[0]:text);
  }catch(e){
    data={title:"", body:text.trim(), tags:[q.costume,"コスプレ"]};
  }
  return {data, yen};
}

/* ---- テンプレモード（0円・本人の過去文面の型から組み立て） ---- */
function tplGenerate(q){
  const T=ASSETS.tpl;
  const tone = q.tone!=="auto" ? q.tone : (lastToneUsed==="oshi"?"yuru":"oshi");
  lastToneUsed = tone;
  const month = new Date().getMonth()+1;
  const fill = s => s.replace(/\{costume\}/g,q.costume).replace(/\{num\}/g,q.num||"")
                    .replace(/\{n\}/g,q.n||"").replace(/\{month\}/g,month)
                    .replace(/\{emoji\}/g,pick(T.emojis)).replace(/\{emoji2\}/g,pick(T.emojis));
  let title, body, parts=[];
  if(q.type==="tsuzuki"){
    title = fill(pick(T.titles_series));
    parts.push(fill(pick(T.tsuzuki)));
    if(q.topic) parts.push(q.topic);
    const c=pick(T.tsuzuki_close); if(c) parts.push(c);
    body = parts.join(" ");
  } else if(q.type==="teaser"){
    title = fill(pick(T.titles_teaser));
    parts.push(fill(pick(T.teaser)));
    if(q.topic) parts.push(q.topic);
    body = parts.join("\n\n");
  } else {
    title = q.type==="month" ? fill(pick(T.titles_month))
          : q.n ? fill(pick(T.titles_maisu)) : fill(pick(T.titles_series));
    parts.push(q.type==="month" ? fill(pick(T.openers_month)) : pick(T.openers_main));
    if(q.topic) parts.push(q.topic);
    parts.push(fill(pick(T.midokoro)));
    if(q.n) parts.push(fill(pick(tone==="oshi"?T.maisu_oshi:T.maisu_yuru)));
    parts.push(pick(tone==="oshi"?T.closers_oshi:T.closers_yuru));
    body = parts.join("\n\n");
  }
  const tags=[q.costume, ...T.tags_base].filter(Boolean);
  return {title, body, tags};
}

/* ---- 復号・起動（ボードと同じ仕組み） ---- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(enc,pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let ENC=null;
async function tryPass(pass){
  try{
    ASSETS=await decrypt(ENC,pass);
    localStorage.setItem("hub-pass",pass);
    el("gate").style.display="none";
    boot();
    return true;
  }catch(e){return false;}
}
async function submitPass(){
  const p=el("gpass").value.trim();
  if(!p) return;
  if(!await tryPass(p)){el("gerr").textContent="パスコードが違うようです";el("gpass").value="";}
}
el("gpass").addEventListener("keydown",e=>{if(e.key==="Enter")submitPass();});
function boot(){
  el("loading").style.display="none";
  el("app").style.display="block";
  setMode("ai");
}
const DEMO_ASSETS={ai:{rules:"（デモ）",output_format:""},
  tpl:{openers_main:["デモ書き出し！"],openers_month:["{month}月デモ！"],
  midokoro:["{costume}のデモ見どころ"],maisu_oshi:["デモ{n}枚のせます"],maisu_yuru:["デモ{n}枚どうぞ"],
  closers_oshi:["デモ締め！"],closers_yuru:["デモ締め〜"],tsuzuki:["{costume}のつづきデモ"],tsuzuki_close:["🫶"],
  teaser:["{costume}のデモ予告"],titles_series:["{costume}{num}{emoji}"],titles_month:["{month}月デモ{costume}"],
  titles_maisu:["デモ{n}枚{costume}"],titles_teaser:["デモ予告{costume}"],emojis:["⭐"],tags_base:["デモ"]}};
(async function(){
  if(new URLSearchParams(location.search).has("demo")){
    ASSETS=DEMO_ASSETS; boot(); return;
  }
  try{
    const r=await fetch("fanbox_assets.enc.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("データファイルが見つかりません");
    ENC=await r.json();
    const saved=localStorage.getItem("hub-pass");
    if(saved&&await tryPass(saved)) return;
    el("loading").style.display="none";
    el("gate").style.display="flex"; el("gpass").focus();
  }catch(e){
    el("loading").textContent="読み込めませんでした（"+e.message+"）";
  }
})();
</script>
